<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#111111" />
  <title>Operator — FURNIPART</title>
  <link rel="icon" href="img/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/operator.css?v=11" />
  <link rel="manifest" href="/manifest-operator.webmanifest" />
  <link rel="apple-touch-icon" href="/img/app-operator-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Operator" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>
<body class="admin op">
  <header class="topbar">
    <div class="wrap topbar-in">
      <span class="brand">
        <img src="img/logo-mark.png" alt="" width="32" height="32" />
        <span class="brand-text"><span><b>FURNI</b>PART</span><small id="opName">operator</small></span>
      </span>
      <button class="btn btn-sm btn-ghost" id="logout" hidden>Chiqish</button>
    </div>
  </header>

  <section id="loginView" class="wrap login" hidden>
    <form id="loginForm" class="panel">
      <h1>Operator paneli</h1>
      <label>Email<input name="email" type="email" required autocomplete="username" /></label>
      <label>Parol<input name="password" type="password" required autocomplete="current-password" /></label>
      <button class="btn btn-yellow btn-block" type="submit">Kirish</button>
      <p class="hint" id="loginMsg"></p>
    </form>
  </section>

  <section id="appView" class="wrap" hidden>
    <div class="op-kpi" id="opKpi"></div>
    <button class="btn btn-yellow btn-block op-addlead" type="button" id="opAddLead">➕ Lid qo'shish</button>
    <nav class="tabs" id="opTabs">
      <button class="tab on" data-v="today">📞 Bugun <span id="nToday"></span></button>
      <button class="tab" data-v="open">Ochiq lidlar <span id="nOpen"></span></button>
      <button class="tab" data-v="closed">Yopilgan</button>
      <button class="tab" data-v="prices">💲 Narxlar</button>
    </nav>
    <div id="opList"></div>
  </section>

  <!-- Operator o'zi lid qo'shadi -->
  <dialog id="addLeadDlg" class="sheet">
    <button class="x" data-close type="button" aria-label="Yopish">×</button>
    <form id="addLeadForm" class="pform">
      <h2>➕ Yangi lid</h2>
      <p class="muted small">Komment, direkt, qo'ng'iroq yoki boshqa joydan o'zingiz olgan raqamni qo'shing — lid sizga biriktiriladi.</p>
      <div class="two">
        <label>Ism<input name="name" maxlength="80" placeholder="Mijoz ismi" /></label>
        <label>Telefon *<input name="phone" type="tel" inputmode="tel" required placeholder="90 123 45 67" /></label>
      </div>
      <div class="fld">Qayerdan olindi? *
        <div class="chip-pick" id="alChannel">
          <button type="button" class="chip on" data-ch="Komment">💬 Komment</button>
          <button type="button" class="chip" data-ch="Direkt">✉️ Direkt</button>
          <button type="button" class="chip" data-ch="Instagram story">📸 Story</button>
          <button type="button" class="chip" data-ch="Telegram">✈️ Telegram</button>
          <button type="button" class="chip" data-ch="Qo'ng'iroq">📞 Qo'ng'iroq qildi</button>
          <button type="button" class="chip" data-ch="Do'konga keldi">🏪 Do'konga keldi</button>
          <button type="button" class="chip" data-ch="Tavsiya">🤝 Tanish orqali</button>
          <button type="button" class="chip" data-ch="Sayt">🌐 Sayt</button>
          <button type="button" class="chip" data-ch="Boshqa">… Boshqa</button>
        </div>
      </div>
      <div class="fld">Targetdanmi (reklama)?
        <div class="chip-pick" id="alTarget">
          <button type="button" class="chip" data-tg="1">📣 Ha, targetdan</button>
          <button type="button" class="chip on" data-tg="0">Yo'q, oddiy</button>
        </div>
      </div>
      <div id="alIg">
        <div class="two">
          <label>Instagram akkauntimiz<select name="account">
            <option value="furnipart.uz">@furnipart.uz</option>
            <option value="furnipart_uz">@furnipart_uz</option>
            <option value="blum.fergana">@blum.fergana</option>
          </select></label>
          <label>Mijoz Instagrami<input name="instagram" maxlength="60" placeholder="@username (ixtiyoriy)" /></label>
        </div>
      </div>
      <label>Nima so'radi (mahsulot)<input name="interest" maxlength="200" placeholder="Masalan: Mramor matras 160×200" /></label>
      <label>Shahar / tuman<input name="region" maxlength="120" placeholder="Masalan: Marg'ilon" /></label>
      <div class="two">
        <label>Holati<select name="stage"><option>Yangi</option><option>Bog'lanildi</option><option>O'ylab ko'radi</option></select></label>
        <label>Keyingi qo'ng'iroq<input name="nextCall" type="date" /></label>
      </div>
      <label>Izoh<textarea name="note" rows="2" maxlength="1000" placeholder="Mijoz nima dedi"></textarea></label>
      <button class="btn btn-yellow btn-block" type="submit">Saqlash</button>
    </form>
  </dialog>

  <!-- Lid kartasi -->
  <dialog id="leadDlg" class="sheet op-sheet">
    <button class="x" data-close type="button" aria-label="Yopish">×</button>
    <div id="leadBody"></div>
  </dialog>

  <!-- Sotuv -->
  <dialog id="saleDlg" class="sheet">
    <button class="x" data-close type="button" aria-label="Yopish">×</button>
    <form id="saleForm" class="pform">
      <h2>💰 Sotuv</h2>
      <label>Mahsulot *<input name="product" list="prodList" required maxlength="200" placeholder="Mahsulot nomi" /></label>
      <datalist id="prodList"></datalist>
      <div class="two">
        <label>Soni<input name="qty" type="number" min="1" value="1" inputmode="numeric" /></label>
        <label>Valyuta<select name="currency"><option>so'm</option><option>$</option></select></label>
      </div>
      <div class="two">
        <label>Umumiy summa *<input name="amount" inputmode="numeric" required placeholder="2 900 000" /></label>
        <label>Olingan (zaklad)<input name="paid" inputmode="numeric" value="0" /></label>
      </div>
      <label>Yetkazish manzili<input name="address" maxlength="200" /></label>
      <label>Izoh<textarea name="note" rows="2" maxlength="500"></textarea></label>
      <button class="btn btn-yellow btn-block" type="submit">Sotuvni saqlash</button>
    </form>
  </dialog>

  <!-- Rad etish -->
  <dialog id="lostDlg" class="sheet">
    <button class="x" data-close type="button" aria-label="Yopish">×</button>
    <form id="lostForm" class="pform">
      <h2>✖ Nega olmadi?</h2>
      <div class="reason-btns" id="lostBtns"></div>
      <label>Izoh<input name="lostNote" maxlength="200" placeholder="Masalan: boshqa do'kondan 10% arzon oldi" /></label>
      <button class="btn btn-dark btn-block" type="submit">Yopish</button>
    </form>
  </dialog>

  <script type="module" src="js/operator.js?v=9"></script>
  <script type="module" src="js/pwa-panel.js?v=1"></script>
</body>
</html>
