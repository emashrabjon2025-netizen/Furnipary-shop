<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FURNIPART premium — mebel furnitura va matraslar</title>
  <meta name="description" content="FURNIPART premium: garderob va oshxona mexanizmlari, divanlar, matraslar, shablonlar. O'zbekiston bo'ylab dastavka. Marg'ilon." />
  <meta name="theme-color" content="#111111" />
  <link rel="icon" href="img/logo.png" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <meta property="og:title" content="FURNIPART premium" />
  <meta property="og:description" content="Mebel furnitura, divan va matraslar. O'zbekiston bo'ylab dastavka." />
  <meta property="og:image" content="img/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="./" aria-label="FURNIPART bosh sahifa">
        <img src="img/logo-mark.png" alt="" width="36" height="36" />
        <span class="brand-text"><span><b>FURNI</b>PART</span><small>premium</small></span>
      </a>
      <button class="cart-btn" id="cartOpen" aria-label="Savat">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM6.2 6l.6 3h12.4l-1.6 6H8.3L5.4 2H2v2h1.8l2.4 11.4A2 2 0 0 0 8.2 17H18v-2H8.3l-.2-1h9.6a2 2 0 0 0 1.9-1.5L22 4H5.8Z"/></svg>
        <span>Savat</span>
        <em id="cartCount" hidden>0</em>
      </button>
    </div>
  </header>

  <section class="hero">
    <div class="wrap">
      <h1>Mebel furnitura,<br />divan va matraslar</h1>
      <p class="hero-sub">Marg'ilondagi do'konimizdan — <b>O'zbekiston bo'ylab dastavka</b>. Matraslarga 5 yil kafolat.</p>
      <div class="hero-actions">
        <a class="btn btn-yellow" href="#katalog">Katalogni ko'rish</a>
        <a class="btn btn-ghost" id="heroPhone" href="tel:+998911259000">Qo'ng'iroq qilish</a>
      </div>
    </div>
  </section>

  <main class="wrap" id="katalog">
    <div class="filters">
      <div class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2Zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg>
        <input id="search" type="search" placeholder="Mahsulot qidirish…" autocomplete="off" />
      </div>
      <div class="chips" id="chips" role="tablist"></div>
    </div>

    <div id="grid" class="grid" aria-live="polite">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
    <p id="empty" class="empty" hidden></p>
  </main>

  <footer class="footer">
    <div class="wrap footer-in">
      <div>
        <div class="brand brand-foot"><img src="img/logo-mark.png" alt="" width="32" height="32" /><span class="brand-text"><span><b>FURNI</b>PART</span><small>premium</small></span></div>
        <p id="footAddress"></p>
      </div>
      <div class="foot-links">
        <a id="footPhone" href="#"></a>
        <a id="footInsta" href="#" target="_blank" rel="noopener">Instagram</a>
        <a id="footTg" href="#" target="_blank" rel="noopener">Telegram kanal</a>
      </div>
    </div>
  </footer>

  <!-- Mahsulot oynasi -->
  <dialog id="productDlg" class="sheet">
    <button class="x" data-close aria-label="Yopish">×</button>
    <div id="productBody"></div>
  </dialog>

  <!-- Savat -->
  <dialog id="cartDlg" class="sheet">
    <button class="x" data-close aria-label="Yopish">×</button>
    <h2>Savat</h2>
    <div id="cartItems"></div>
    <div id="cartFooter"></div>
  </dialog>

  <script type="module" src="js/shop.js?v=6"></script>
</body>
</html>
