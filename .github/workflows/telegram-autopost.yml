name: Telegram avtopost (har 1.5 soat)

# Toshkent vaqti bilan 08:00 dan 21:30 gacha har 1.5 soatda bitta mahsulot (UTC = Toshkent - 5).
on:
  schedule:
    - cron: "0 3,6,9,12,15 * * *"
    - cron: "30 4,7,10,13,16 * * *"
  workflow_dispatch:

concurrency: telegram-autopost

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Navbatdagi mahsulotni kanalga yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@Furnipart_uz"
        run: python tools/autopost/autopost.py telegram
