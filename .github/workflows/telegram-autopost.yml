name: Telegram avtopost (har 3 soat)

# Toshkent vaqti bilan 08:00, 11:00, 14:00, 17:00 da bitta mahsulot (UTC = Toshkent - 5).
on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 6 * * *"
    - cron: "0 9 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

concurrency: telegram-autopost

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Navbatdagi mahsulotni kanalga yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@Furnipart_uz"
          # qaysi cron ishga tushirgani — GitHub kechiksa ham navbat to'g'ri qoladi
          SCHEDULE: ${{ github.event.schedule }}
        run: python tools/autopost/autopost.py telegram
