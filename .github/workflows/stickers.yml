name: Telegram stikerlar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["stickers/**"]

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stiker to'plamini yaratish / yangilash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          USER_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 stickers/make_pack.py
