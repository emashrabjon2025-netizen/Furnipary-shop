name: sitecheck
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://furnipart-shop.vercel.app
          curl -sL $B/admin | grep -o 'crm.js?v=[0-9]*'
          J=$(curl -sL "$B/js/crm.js?x=$RANDOM")
          for m in campMetrics planRevenue evening askReason noAnswer; do echo "$m: $(echo "$J" | grep -c $m)"; done
          curl -s "$B/api/digest?mode=evening&dry=1" -o /dev/null -w "digest %{http_code}\n"
          curl -s "$B/stickers/stickers.json" -o /dev/null -w "stickers %{http_code}\n"
          curl -s "$B/tools/callbot/scenario.json" -o /dev/null -w "callbot %{http_code}\n"
          curl -s "$B/img/video/2026-11-05/audio-v2" -o /dev/null -w "v2 %{http_code}\n"
