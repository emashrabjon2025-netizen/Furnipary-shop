name: sitecheck
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://furnipart-shop.vercel.app
          curl -sL $B/admin | grep -o 'crm.js?v=[0-9]*\|sitechat-admin.js?v=[0-9]*' | tr '\n' ' '; echo
          curl -s "$B/" | grep -o 'app.js?v=[0-9]*\|manifest.webmanifest' | tr '\n' ' '; echo
          curl -s "$B/sw.js" -o /dev/null -w "sw %{http_code}\n"
          echo "vapid: $(curl -s "$B/api/push?vapid=1" | head -c 200)"
          echo "chat404: $(curl -s -o /dev/null -w '%{http_code}' "$B/api/chat?cid=aaaaaaaaaaaaaaaaaaaa")"
