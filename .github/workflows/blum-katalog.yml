name: Blum katalog rasmlari

on:
  push:
    branches: [blum-katalog]
    paths: [blum-katalog/request.txt]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: blum-katalog
      - name: Poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils imagemagick
      - name: Katalogni yuklab olish
        if: ${{ false }}
        run: |
          curl -sSL -o /tmp/k.pdf "https://publications.blum.com/2024/catalogue/ru/files/assets/common/downloads/%D0%9A%D0%B0%D1%82%D0%B0%D0%BB%D0%BE%D0%B3%20%D0%B8%20%D1%82%D0%B5%D1%85%D0%BD%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%BE%D0%B5%20%D1%80%D1%83%D0%BA%D0%BE%D0%B2%D0%BE%D0%B4%D1%81%D1%82%D0%B2%D0%BE%202024-2025%20ru.pdf?uni=a14bd0bc32c70c75ea098ed3b51b4ac1"
          ls -la /tmp/k.pdf
          pdfinfo /tmp/k.pdf | head -20
      - name: Ajratish
        run: |
          set -e
          MODE=$(head -1 blum-katalog/request.txt)
          OUT=blum-katalog/out
          mkdir -p $OUT
          if [ "$MODE" = "check" ]; then
            while read u; do [ -z "$u" ] && continue; c=$(curl -s -o /dev/null -w '%{http_code}' -A "Mozilla/5.0" -L "$u"); echo "$c $u"; done < blum-katalog/check-urls.txt | tee $OUT/check.txt
          elif [ "$MODE" = "web" ]; then
            python3 blum-katalog/web.py
          elif [ "$MODE" = "index" ]; then
            pdfinfo /tmp/k.pdf > $OUT/info.txt
            pdftotext -layout /tmp/k.pdf $OUT/text.txt
            pdfimages -list /tmp/k.pdf > $OUT/images-list.txt
            mkdir -p $OUT/thumbs
            pdftoppm -r 18 -jpeg -jpegopt quality=60 /tmp/k.pdf $OUT/thumbs/t
          else
            # MODE = "pages" ; next lines: page numbers
            mkdir -p $OUT/img $OUT/pages
            tail -n +2 blum-katalog/request.txt | while read p; do
              [ -z "$p" ] && continue
              pdfimages -f $p -l $p -all -p /tmp/k.pdf /tmp/i
              pdftoppm -f $p -l $p -r 110 -jpeg -jpegopt quality=82 /tmp/k.pdf $OUT/pages/p
            done
            for f in /tmp/i-*; do
              w=$(identify -format '%w' "$f[0]" 2>/dev/null || echo 0)
              h=$(identify -format '%h' "$f[0]" 2>/dev/null || echo 0)
              if [ "$w" -ge 250 ] && [ "$h" -ge 150 ]; then
                b=$(basename "$f"); b=${b%.*}
                convert "$f[0]" -colorspace sRGB -resize '1400x1400>' -quality 86 $OUT/img/$b.jpg || true
              fi
            done
          fi
          du -sh $OUT
      - name: Commit
        run: |
          git config user.name "furnipart-bot"
          git config user.email "bot@users.noreply.github.com"
          git add blum-katalog/out
          git commit -m "Blum katalog: $(head -1 blum-katalog/request.txt)" || echo "o'zgarish yo'q"
          git push
