name: Telegram opros (09:00 va 15:00, natija 7 kunda botga)

# Toshkent vaqti bilan 09:00 — qiziqarli/viktorina, 15:00 — og'riq + sotuvga chorlash (UTC = Toshkent - 5).
on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "ertalab yoki kunduz"
        default: "ertalab"

permissions:
  contents: write

concurrency: telegram-opros

jobs:
  opros:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bugungi oprosni kanalga yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@Furnipart_uz"
          ADMIN_CHAT: ${{ secrets.TELEGRAM_CHAT_ID || '5345741396' }}
        run: |
          # 7 kun bo'lgan oproslar: yopiladi, foizlari botga keladi
          python tools/opros/opros.py natija
          case "${{ github.event.schedule }}" in
            "0 4 * * *")  SLOT=ertalab ;;
            "0 10 * * *") SLOT=kunduz ;;
            *)            SLOT="${{ github.event.inputs.slot || 'auto' }}" ;;
          esac
          python tools/opros/opros.py "$SLOT"
      - name: Yuborilgan oproslar ro'yxatini saqlash
        if: always()
        run: |
          git config user.name "furnipart-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/opros/sent.json 2>/dev/null || exit 0
          git commit -m "Opros ro'yxati yangilandi" || exit 0
          git pull --rebase -q
          git push
