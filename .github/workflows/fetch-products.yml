name: fetch-products
# Saytdagi mahsulotlarni (nom, narx, rasm) kategoriya bo'yicha tools/tmp/<kat>/ ga yuklaydi (PDF/kontent uchun)
on:
  workflow_dispatch:
    inputs:
      cat:
        description: "Kategoriya nomidagi so'z (masalan: divan)"
        required: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          CAT: ${{ github.event.inputs.cat }}
        run: |
          curl -s -m 120 "https://furnipart-shop.vercel.app/api/remind?products=$CAT" -o /tmp/p.json
          python3 - <<'PY'
          import json, os, base64, re
          cat = os.environ["CAT"].lower()
          d = json.load(open("/tmp/p.json"))
          out = f"tools/tmp/{re.sub('[^a-z0-9]+','-',cat)}"
          os.makedirs(out, exist_ok=True)
          for it in d.get("items", []):
              files = []
              for k, src in enumerate(it.pop("imgs", [])):
                  if "base64," in src:
                      fn = f"{it['id']}__{k}.jpg"
                      open(f"{out}/{fn}", "wb").write(base64.b64decode(src.split("base64,", 1)[1]))
                      files.append(fn)
              it["files"] = files
          json.dump(d.get("items", []), open(f"{out}/products.json", "w"), ensure_ascii=False, indent=1, default=str)
          print(len(d.get("items", [])), "mahsulot")
          PY
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add tools/tmp && git commit -m "fetch-products: $CAT" && git push || echo "o'zgarish yo'q"
