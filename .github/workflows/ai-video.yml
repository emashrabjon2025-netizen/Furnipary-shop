name: AI video kliplar (Google Veo)

on:
  workflow_dispatch:
    inputs:
      shots:
        description: "Kadrlar JSON yo'li"
        required: true
      out:
        description: "Kliplar papkasi"
        required: true
      only:
        description: "Faqat shu kadrlar (masalan 1,3), bo'sh = hammasi"
        required: false
        default: ""
      model:
        description: "Veo modeli"
        required: false
        default: "veo-3.1-generate-preview"

permissions:
  contents: write

concurrency: ai-video

jobs:
  veo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Kliplar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/ai_video/veo.py "${{ inputs.shots }}" "${{ inputs.out }}" --model "${{ inputs.model }}" ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
      - name: Saqlash
        if: always()
        run: |
          git config user.name "furnipart-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "${{ inputs.out }}" || true
          git commit -m "AI kliplar: ${{ inputs.out }}" || exit 0
          git pull --rebase -q
          git push
