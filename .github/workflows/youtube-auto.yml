name: YouTube Shorts — avtomatik yuklash

# Yangi img/video/<sana>/reel.mp4 push qilinishi bilan YouTube Shorts'ga yuklaydi
# (Instagram Reels bilan bir vaqtda — ertasi kuni 12:30 da chiqadi).
on:
  push:
    branches: [main]
    paths:
      - "img/video/*/reel.mp4"
  workflow_dispatch:
    inputs:
      folder:
        description: "Faqat shu papka (masalan 2026-11-15); bo'sh = yuklanmaganlarning hammasi"
        required: false
        default: ""

permissions:
  contents: write

concurrency: youtube-auto

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Kalitlar
        id: keys
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ -z "$YT_REFRESH_TOKEN" ]; then
            echo "::warning::YT_CLIENT_ID / YT_CLIENT_SECRET / YT_REFRESH_TOKEN secretlari hali qo'shilmagan — YouTube'ga yuklanmadi"
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - name: YouTube'ga yuklash
        if: steps.keys.outputs.ok == '1'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 tools/youtube/auto.py "${{ inputs.folder }}"
      - name: Havolani saqlash
        if: steps.keys.outputs.ok == '1'
        run: |
          git config user.name "furnipart-bot"
          git config user.email "actions@users.noreply.github.com"
          git add img/video/*/youtube.txt 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "YouTube havolalari"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && break; sleep 5; done
      - name: Botga xabar
        if: always() && steps.keys.outputs.ok == '1'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
        run: |
          [ -z "$TOKEN" ] && exit 0
          CHAT=${CHAT:-5345741396}
          if [ "$STATUS" = "success" ]; then
            [ -s yt_result.txt ] || exit 0
            TEXT="▶️ YouTube Shorts'ga yuklandi:
          $(cat yt_result.txt)"
          else
            TEXT="⚠️ YouTube'ga yuklashda xato. GitHub Actions → \"YouTube Shorts — avtomatik yuklash\" logini ko'ring."
          fi
          curl -sS "https://api.telegram.org/bot$TOKEN/sendMessage" --form-string "chat_id=$CHAT" --form-string "text=$TEXT" > /dev/null
