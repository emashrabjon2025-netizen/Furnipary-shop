<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Dastavka" />
  <title>Dastavka — FURNIPART</title>
  <link rel="icon" href="img/logo.png" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/operator.css?v=6" />
</head>
<body class="admin op">
  <header class="topbar">
    <div class="wrap topbar-in">
      <span class="brand">
        <img src="img/logo-mark.png" alt="" width="32" height="32" />
        <span class="brand-text"><span><b>FURNI</b>PART</span><small id="opName">dastavka</small></span>
      </span>
      <button class="btn btn-sm btn-ghost" id="logout" hidden>Chiqish</button>
    </div>
  </header>

  <section id="loginView" class="wrap login" hidden>
    <form id="loginForm" class="panel">
      <h1>🚚 Dastavka paneli</h1>
      <label>Email<input name="email" type="email" required autocomplete="username" /></label>
      <label>Parol<input name="password" type="password" required autocomplete="current-password" /></label>
      <button class="btn btn-yellow btn-block" type="submit">Kirish</button>
      <p class="hint" id="loginMsg"></p>
    </form>
  </section>

  <section id="appView" class="wrap" hidden>
    <div class="op-kpi" id="dvKpi"></div>
    <div class="dv-tools">
      <button class="btn btn-yellow" type="button" id="dvAdd">➕ Klient qo'shish</button>
      <label class="btn btn-dark file-btn">📥 Excel'dan qo'shish<input id="dvImport" type="file" accept=".xlsx,.xls,.csv" hidden /></label>
      <button class="btn btn-line btn-sm" type="button" id="dvTemplate">⬇ Excel namunasi</button>
    </div>
    <nav class="tabs" id="dvTabs">
      <button class="tab on" data-v="today">🚚 Bugun yetkaziladigan <span id="nToday"></span></button>
      <button class="tab" data-v="tomorrow">📅 Ertaga yetkaziladigan <span id="nTomorrow"></span></button>
      <button class="tab" data-v="later">🗓 Keyingi kunlar <span id="nLater"></span></button>
      <button class="tab" data-v="done">✅ Yetkazilgan</button>
    </nav>
    <div class="dv-areas" id="dvAreas"></div>
    <div class="dv-route" id="dvRoute"></div>
    <div id="dvList"></div>
  </section>

  <!-- Yetkazish kartasi -->
  <dialog id="dvDlg" class="sheet op-sheet">
    <button class="x" data-close type="button" aria-label="Yopish">×</button>
    <div id="dvBody"></div>
  </dialog>

  <!-- Klient qo'shish -->
  <dialog id="addDlg" class="sheet">
    <button class="x" data-close type="button" aria-label="Yopish">×</button>
    <form id="addForm" class="pform">
      <h2>➕ Yangi yetkazish</h2>
      <div class="two">
        <label>Ism *<input name="name" required maxlength="60" /></label>
        <label>Telefon *<input name="phone" type="tel" inputmode="tel" required placeholder="90 123 45 67" /></label>
      </div>
      <label>Shahar / tuman<select name="area"></select></label>
      <label>Manzil *<input name="address" required maxlength="160" placeholder="Ko'cha, uy, mo'ljal" /></label>
      <label>Mahsulot *<input name="product" required maxlength="160" placeholder="Masalan: Ortopedik matras 160×200" /></label>
      <div class="two">
        <label>Soni<input name="qty" type="number" min="1" value="1" inputmode="numeric" /></label>
        <label>Valyuta<select name="currency"><option>so'm</option><option>$</option></select></label>
      </div>
      <label>Umumiy summa *<input name="amount" inputmode="decimal" required placeholder="2 900 000" /></label>
      <label>Qachon yetkaziladi</label>
      <div class="reason-btns" id="addWhen">
        <button type="button" class="btn btn-line on" data-when="today">🚚 Bugun</button>
        <button type="button" class="btn btn-line" data-when="tomorrow">📅 Ertaga</button>
      </div>
      <label id="addCourierWrap" hidden>🚚 Kuryer<select name="courier"></select></label>
      <label>Izoh<input name="note" maxlength="300" placeholder="Qavat, lift, qo'ng'iroq qilib borish…" /></label>
      <button class="btn btn-yellow btn-block" type="submit">Qo'shish</button>
    </form>
  </dialog>

  <!-- Yetkazildi -->
  <dialog id="doneDlg" class="sheet">
    <button class="x" data-close type="button" aria-label="Yopish">×</button>
    <form id="doneForm" class="pform">
      <h2>✅ Yetkazildi</h2>
      <p class="muted" id="doneInfo"></p>
      <label>Izoh<input name="note" maxlength="200" placeholder="Masalan: naqd, Click, qo'shnisiga topshirildi" /></label>
      <button class="btn btn-yellow btn-block" type="submit">Tasdiqlash</button>
    </form>
  </dialog>

  <!-- Boshqa kunga -->
  <dialog id="moveDlg" class="sheet">
    <button class="x" data-close type="button" aria-label="Yopish">×</button>
    <form id="moveForm" class="pform">
      <h2>📅 Boshqa kunga o'tkazish</h2>
      <label>Yangi sana<input name="date" type="date" required /></label>
      <div class="reason-btns" id="moveBtns">
        <button type="button" class="btn btn-line" data-r="Mijoz uyda yo'q">Uyda yo'q</button>
        <button type="button" class="btn btn-line" data-r="Telefon ko'tarmadi">Telefon ko'tarmadi</button>
        <button type="button" class="btn btn-line" data-r="Mijoz o'zi so'radi">Mijoz so'radi</button>
        <button type="button" class="btn btn-line" data-r="Ulgurmadim">Ulgurmadim</button>
      </div>
      <label>Izoh<input name="note" maxlength="200" /></label>
      <button class="btn btn-dark btn-block" type="submit">Saqlash</button>
    </form>
  </dialog>

  <script type="module" src="js/courier.js?v=8"></script>
</body>
</html>
